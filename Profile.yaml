policy_groups:
- select:
    name: Proxy
    policies:
    - 订阅
    - 台湾
    - 新加坡
    - 日本
    - 美国
    - 其他节点
    - 低倍率节点
- select:
    name: 订阅
    policies:
    - DIRECT
    urls: []
    filter: (?i)^(?!.*(?:🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|电报|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|过滤|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b)).*$
    update_interval: 86400
- select:
    name: Direct
    policies:
    - DIRECT
- select:
    name: AI
    policies:
    - Proxy
    - 日本
    - 台湾
    - 其他节点
- select:
    name: Google
    policies:
    - Proxy
- select:
    name: 媒体
    policies:
    - Proxy
    - 低倍率节点
- select:
