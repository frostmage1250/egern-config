ipv6: true
allow_external_connections: true
vif_only: true
include_all_networks: true
include_apns: true
block_quic: false
default_subscription_group: 订阅
default_proxy_group: 代理
dns:
  bootstrap:
  - 114.114.114.114
  - 223.5.5.5
  - 1.12.12.12
  upstreams:
    Foreign:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    Policy-douyin:
    - 180.184.1.1
    - 180.184.2.2
    Policy-cn:
    - 223.5.5.5
    - 119.29.29.29
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/egern/rules/private.yaml
      update_interval: 86400
      value: system
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/egern/rules/douyin.yaml
      update_interval: 86400
      value: Policy-douyin
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/egern/rules/cn.yaml
      update_interval: 86400
      value: Policy-cn
  - domain_wildcard:
      match: '*'
      value: Foreign
  hosts:
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    services.googleapis.cn: services.googleapis.com
    mcdn.bilivideo.com: &id001
    - 0.0.0.0
    '*.mcdn.bilivideo.com': *id001
    mcdn.bilivideo.cn: &id002
    - 0.0.0.0
    '*.mcdn.bilivideo.cn': *id002
    edge.mountaintoys.cn: &id003
    - 0.0.0.0
    '*.edge.mountaintoys.cn': *id003
    h2.smtcdns.net: &id004
    - 0.0.0.0
    '*.h2.smtcdns.net': *id004
    11612bj3-b76c.aws-agent.biz: 06996bj6-79x5.apt-agent.com
    b76c5sh0-fde6.aws-agent.biz: 08233sh6-12d1.apt-agent.com
    fde63gz6-1y61.aws-agent.biz: 09571gz6-86k1.apt-agent.com
  proxy_nameservers:
  - https://zone.rlose.com:39933/api-query
  - https://radar.rlose.com/api-query
