name: Update Egern configuration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-egern.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    # Every 6 hours, 54 minutes after the converter (UTC).
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: update-egern-configuration
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install builder dependency
        run: python -m pip install --requirement requirements.txt

      - name: Resolve published rule manifest and Mihomo model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          converter_commit="$(gh api repos/frostmage1250/proxy-rules-converter/commits/main --jq .sha)"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/frostmage1250/proxy-rules-converter/${converter_commit}/reports/egern-source.json" \
            --output "${RUNNER_TEMP}/egern-source.json"
          mihomo_commit="$(jq --exit-status --raw-output '.mihomo_script.commit' "${RUNNER_TEMP}/egern-source.json")"
          echo "CONVERTER_COMMIT=${converter_commit}" >> "${GITHUB_ENV}"
          echo "MIHOMO_COMMIT=${mihomo_commit}" >> "${GITHUB_ENV}"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/frostmage1250/mihomo-script/${mihomo_commit}/mihomoScript.js" \
            --output "${RUNNER_TEMP}/mihomoScript.js"

      - name: Extract pinned Mihomo model
        run: |
          node src/extract_mihomo_model.js \
            "${RUNNER_TEMP}/mihomoScript.js" > "${RUNNER_TEMP}/mihomo-model.json"

      - name: Generate Egern profile from published rules
        run: |
          python src/build_egern.py \
            --model "${RUNNER_TEMP}/mihomo-model.json" \
            --manifest "${RUNNER_TEMP}/egern-source.json" \
            --mihomo-commit "${MIHOMO_COMMIT}" \
            --converter-commit "${CONVERTER_COMMIT}"

      - name: Run builder tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify deterministic regeneration
        run: |
          python src/build_egern.py \
            --model "${RUNNER_TEMP}/mihomo-model.json" \
            --manifest "${RUNNER_TEMP}/egern-source.json" \
            --mihomo-commit "${MIHOMO_COMMIT}" \
            --converter-commit "${CONVERTER_COMMIT}" \
            --check
          git diff --check

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git add -- Profile.yaml reports/source.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update generated Egern configuration"
            git push
          else
            echo "No generated configuration changes."
          fi

      - name: Verify files published by the remote commit
        shell: bash
        run: |
          set -euo pipefail
          published_commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "${published_commit}" = "${remote_commit}"
          while IFS= read -r file; do
            remote_file="${RUNNER_TEMP}/published-${file//\//-}"
            curl --fail --location --silent --show-error               "https://raw.githubusercontent.com/frostmage1250/egern-config/${published_commit}/${file}"               --output "${remote_file}"
            cmp --silent "${file}" "${remote_file}"
          done < <(printf '%s\n' Profile.yaml reports/source.json)
          echo "Verified generated files at remote commit ${published_commit}."
