name: Update Egern configuration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-egern.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    # Every 6 hours, 54 minutes after the converter (UTC).
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: update-egern-configuration
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install builder dependency
        run: python -m pip install --requirement requirements.txt

      - name: Resolve immutable upstream revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mihomo_commit="$(gh api repos/frostmage1250/mihomo-script/commits/main --jq .sha)"
          bett_commit="$(gh api repos/appshubcc/bett-rules/commits/meta --jq .sha)"
          converter_commit="$(gh api repos/frostmage1250/proxy-rules-converter/commits/main --jq .sha)"
          apns_commit="$(gh api repos/ttyyss2233/Tool/commits/main --jq .sha)"
          echo "MIHOMO_COMMIT=${mihomo_commit}" >> "${GITHUB_ENV}"
          echo "BETT_COMMIT=${bett_commit}" >> "${GITHUB_ENV}"
          echo "CONVERTER_COMMIT=${converter_commit}" >> "${GITHUB_ENV}"
          echo "APNS_COMMIT=${apns_commit}" >> "${GITHUB_ENV}"
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/frostmage1250/mihomo-script/${mihomo_commit}/mihomoScript.js"             --output "${RUNNER_TEMP}/mihomoScript.js"

      - name: Extract current Mihomo model
        run: |
          node src/extract_mihomo_model.js             "${RUNNER_TEMP}/mihomoScript.js"             > "${RUNNER_TEMP}/mihomo-model.json"

      - name: Generate Egern profile and native YAML rules
        run: |
          python src/build_egern.py             --model "${RUNNER_TEMP}/mihomo-model.json"             --mihomo-commit "${MIHOMO_COMMIT}"             --bett-commit "${BETT_COMMIT}"             --converter-commit "${CONVERTER_COMMIT}"             --apns-commit "${APNS_COMMIT}"

      - name: Run builder tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify deterministic regeneration
        run: |
          python src/build_egern.py             --model "${RUNNER_TEMP}/mihomo-model.json"             --mihomo-commit "${MIHOMO_COMMIT}"             --bett-commit "${BETT_COMMIT}"             --converter-commit "${CONVERTER_COMMIT}"             --apns-commit "${APNS_COMMIT}"             --check
          git diff --check

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git add -- Profile.yaml rules reports/source.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update generated Egern configuration"
            git push
          else
            echo "No generated configuration changes."
          fi

      - name: Verify files published by the remote commit
        shell: bash
        run: |
          set -euo pipefail
          published_commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "${published_commit}" = "${remote_commit}"
          while IFS= read -r file; do
            remote_file="${RUNNER_TEMP}/published-${file//\//-}"
            curl --fail --location --silent --show-error               "https://raw.githubusercontent.com/frostmage1250/egern-config/${published_commit}/${file}"               --output "${remote_file}"
            cmp --silent "${file}" "${remote_file}"
          done < <(printf '%s\n' Profile.yaml reports/source.json; find rules -maxdepth 1 -type f -name '*.yaml' -printf '%p\n' | sort)
          echo "Verified generated files at remote commit ${published_commit}."
