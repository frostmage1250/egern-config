name: Publish Egern profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-egern.yml"
      - "src/**"
      - "custom/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: publish-egern-profile
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install --requirement requirements.txt
      - name: Read one script, apply customizations, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=custom/customizations.json
          script_repo="$(jq -r '.source.repository' "$manifest")"
          script_branch="$(jq -r '.source.branch' "$manifest")"
          script_path="$(jq -r '.source.path' "$manifest")"
          rules_repo="$(jq -r '.rule_source.repository' "$manifest")"
          rules_branch="$(jq -r '.rule_source.branch' "$manifest")"
          rules_dir="$(jq -r '.rule_source.directory' "$manifest")"
          mihomo_commit="$(gh api "repos/${script_repo}/commits/${script_branch}" --jq .sha)"
          rules_commit="$(gh api "repos/${rules_repo}/commits/${rules_branch}" --jq .sha)"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${script_repo}/${mihomo_commit}/${script_path}" \
            --output "${RUNNER_TEMP}/mihomoScript.js"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${rules_repo}/${rules_commit}/${rules_dir}/index.json" \
            --output "${RUNNER_TEMP}/rules-index.json"
          node src/extract_mihomo_model.js "${RUNNER_TEMP}/mihomoScript.js" > "${RUNNER_TEMP}/mihomo.json"
          python src/build_egern.py --model "${RUNNER_TEMP}/mihomo.json" --index "${RUNNER_TEMP}/rules-index.json"
          if [[ "${{ github.event_name }}" == push ]]; then
            python -m unittest discover -s tests -q
          fi
          git add -- Profile.yaml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "chore: publish customized Egern profile"
            git push origin HEAD:refs/heads/main
          fi
